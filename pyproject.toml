[project]
name = "recon-agent"
version = "0.1.0"
description = "Multi-source reconciliation agent (Razorpay AI Buildathon, Track 04)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.40",
    "google-genai>=2.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.scripts]
recon = "recon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
